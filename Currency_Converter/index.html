<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Currency Converter</title>
  <style>
    :root{--ink:#eef3ff;--muted:#aab6d2;--panel:rgba(18,28,54,.78);--line:rgba(180,201,255,.16);--accent:#6ee7d0;--accent2:#7c9cff;--danger:#ff9aaf}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0a1020;min-height:100vh;display:grid;place-items:center;padding:28px;background-image:radial-gradient(circle at 12% 12%,#27498b 0,transparent 34rem),radial-gradient(circle at 87% 83%,#175b63 0,transparent 30rem)}
    .app{width:min(100%,700px);padding:clamp(24px,5vw,48px);border:1px solid var(--line);background:var(--panel);box-shadow:0 24px 70px #0008;border-radius:28px;backdrop-filter:blur(20px)}.brand{display:flex;gap:14px;align-items:center;margin-bottom:30px}.mark{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;font-size:23px;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 7px 22px #63b7d755}.brand h1{font-size:clamp(1.4rem,4vw,2rem);line-height:1.1;margin:0;letter-spacing:-.04em}.brand p{margin:4px 0 0;color:var(--muted);font-size:.88rem}.label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}.amount-box{position:relative}.amount-box input{width:100%;padding:16px 76px 16px 17px;border:1px solid var(--line);border-radius:15px;background:#08122699;color:var(--ink);font:700 clamp(1.4rem,4vw,2rem)/1.2 inherit;outline:none;transition:.2s}.amount-box input:focus,.currency:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px #6ee7d023}.currency-code{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--accent)}.choices{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;margin:26px 0}.currency{border:1px solid var(--line);border-radius:15px;background:#08122699;padding:10px 12px;transition:.2s}.currency select{appearance:none;border:0;background:transparent;color:var(--ink);font:700 1rem inherit;width:100%;outline:0;cursor:pointer}.currency option{background:#101a30}.swap{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:#192747;color:var(--accent);font-size:1.3rem;cursor:pointer;transition:.2s}.swap:hover{transform:rotate(180deg);background:#263a66}.convert{width:100%;border:0;border-radius:15px;padding:16px 20px;color:#071321;background:linear-gradient(100deg,var(--accent),#9ddcff);font:800 1rem inherit;cursor:pointer;box-shadow:0 9px 24px #6ee7d033;transition:.2s}.convert:hover{filter:brightness(1.08);transform:translateY(-1px)}.convert:disabled{cursor:wait;opacity:.65}.result{margin-top:25px;padding:22px;border-radius:18px;border:1px solid #6ee7d02b;background:linear-gradient(125deg,#152b427d,#102138a8)}.result small{color:var(--muted);font-weight:600}.total{font-size:clamp(1.7rem,6vw,3rem);font-weight:800;letter-spacing:-.045em;margin:5px 0;word-break:break-word}.words{margin:0;color:#d4e0fa}.rate{margin-top:15px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}.status{min-height:22px;margin:14px 2px 0;color:var(--muted);font-size:.86rem}.status.error{color:var(--danger)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:520px){body{padding:14px}.app{padding:24px 18px;border-radius:22px}.choices{grid-template-columns:1fr 42px 1fr;gap:7px}.swap{width:42px;height:42px}.currency{padding:9px}.currency select{font-size:.88rem}}
  </style>
</head>
<body>
  <main class="app" aria-labelledby="title">
    <header class="brand"><div class="mark" aria-hidden="true">↗</div><div><h1 id="title">Currency Converter</h1><p>Clear exchange rates, with every total written out.</p></div></header>
    <form id="converter" novalidate>
      <label class="label" for="amount">Amount</label>
      <div class="amount-box"><input id="amount" inputmode="decimal" autocomplete="off" value="100" aria-describedby="status"><span class="currency-code" id="inputCode">USD</span></div>
      <div class="choices">
        <div><label class="label" for="from">From</label><div class="currency"><select id="from" aria-label="Convert from currency"></select></div></div>
        <button class="swap" type="button" id="swap" aria-label="Swap selected currencies" title="Swap currencies">⇄</button>
        <div><label class="label" for="to">To</label><div class="currency"><select id="to" aria-label="Convert to currency"></select></div></div>
      </div>
      <label class="label" for="numbering">Number format in words</label>
      <div class="currency"><select id="numbering" aria-label="Number format in words"><option value="international">International — million / billion</option><option value="indian">Indian — lakh / crore</option></select></div>
      <button class="convert" id="convert" type="submit">Convert currency</button>
    </form>
    <section class="result" aria-live="polite" aria-atomic="true"><small>Converted amount</small><div class="total" id="total">—</div><p class="words" id="words">Enter an amount to see it in words.</p><div class="rate" id="rate">Live rate will appear here.</div></section>
    <div class="status" id="status" role="status"></div>
  </main>
  <script>
  (()=>{
    // Original ExchangeRate-API endpoint retained; no API key is needed for this open endpoint.
    const BASE_URL='https://open.er-api.com/v6/latest';
    // Embedded country mapping makes this page independent of the old external codes.js dependency.
    const countryList={USD:'US',INR:'IN',EUR:'EU',GBP:'GB',JPY:'JP',AUD:'AU',CAD:'CA',CNY:'CN',CHF:'CH',AED:'AE',SGD:'SG',NZD:'NZ',KRW:'KR',HKD:'HK',THB:'TH',MYR:'MY',IDR:'ID',PHP:'PH',ZAR:'ZA',BRL:'BR',MXN:'MX',SEK:'SE',NOK:'NO',DKK:'DK',PLN:'PL',TRY:'TR',SAR:'SA',QAR:'QA',KWD:'KW',BHD:'BH',OMR:'OM',EGP:'EG',PKR:'PK',BDT:'BD',LKR:'LK',NPR:'NP',VND:'VN',CZK:'CZ',HUF:'HU',RON:'RO',UAH:'UA',ILS:'IL'};
    const names={USD:'US Dollar',INR:'Indian Rupee',EUR:'Euro',GBP:'British Pound',JPY:'Japanese Yen',AUD:'Australian Dollar',CAD:'Canadian Dollar',CNY:'Chinese Yuan',CHF:'Swiss Franc',AED:'UAE Dirham',SGD:'Singapore Dollar',NZD:'New Zealand Dollar',KRW:'South Korean Won',HKD:'Hong Kong Dollar',THB:'Thai Baht',MYR:'Malaysian Ringgit',IDR:'Indonesian Rupiah',PHP:'Philippine Peso',ZAR:'South African Rand',BRL:'Brazilian Real',MXN:'Mexican Peso',SEK:'Swedish Krona',NOK:'Norwegian Krone',DKK:'Danish Krone',PLN:'Polish Zloty',TRY:'Turkish Lira',SAR:'Saudi Riyal',QAR:'Qatari Riyal',KWD:'Kuwaiti Dinar',BHD:'Bahraini Dinar',OMR:'Omani Rial',EGP:'Egyptian Pound',PKR:'Pakistani Rupee',BDT:'Bangladeshi Taka',LKR:'Sri Lankan Rupee',NPR:'Nepalese Rupee',VND:'Vietnamese Dong',CZK:'Czech Koruna',HUF:'Hungarian Forint',RON:'Romanian Leu',UAH:'Ukrainian Hryvnia',ILS:'Israeli New Shekel'};
    const currencyUnits={INR:'rupees',USD:'US dollars',EUR:'euros',GBP:'pounds',JPY:'yen',AUD:'Australian dollars',CAD:'Canadian dollars',CNY:'yuan',CHF:'Swiss francs',AED:'dirhams',SGD:'Singapore dollars',NZD:'New Zealand dollars',KRW:'won',HKD:'Hong Kong dollars',THB:'baht',MYR:'ringgit',IDR:'rupiah',PHP:'pesos',ZAR:'rand',BRL:'reais',MXN:'pesos',SEK:'kronor',NOK:'Norwegian kroner',DKK:'Danish kroner',PLN:'zloty',TRY:'lira',SAR:'riyals',QAR:'riyals',KWD:'dinars',BHD:'dinars',OMR:'rials',EGP:'Egyptian pounds',PKR:'Pakistani rupees',BDT:'taka',LKR:'Sri Lankan rupees',NPR:'Nepalese rupees',VND:'dong',CZK:'koruna',HUF:'forints',RON:'lei',UAH:'hryvnia',ILS:'shekels'};
    const $=id=>document.getElementById(id), from=$('from'),to=$('to'),amount=$('amount'),total=$('total'),words=$('words'),rate=$('rate'),status=$('status'),button=$('convert'),numbering=$('numbering');
    Object.keys(countryList).sort().forEach(code=>[from,to].forEach(s=>s.add(new Option(`${code} — ${names[code]||code}`,code))));from.value='USD';to.value='INR';
    const formatter=(n,c)=>new Intl.NumberFormat(undefined,{style:'currency',currency:c,maximumFractionDigits:2}).format(n);
    const underTwenty=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
    function smallWords(n){if(n<20)return underTwenty[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?'-'+underTwenty[n%10]:'');return underTwenty[Math.floor(n/100)]+' hundred'+(n%100?' '+smallWords(n%100):'')}
    function internationalWords(value){let n=Math.floor(Math.abs(value));if(!Number.isSafeInteger(n))return 'a very large amount';if(n===0)return 'zero';const scales=['','thousand','million','billion','trillion'];let out=[],i=0;while(n){let part=n%1000;if(part)out.unshift(smallWords(part)+(scales[i]?' '+scales[i]:''));n=Math.floor(n/1000);i++}return out.join(' ')}
    function indianWords(value){let n=Math.floor(Math.abs(value));if(!Number.isSafeInteger(n))return 'a very large amount';if(n===0)return 'zero';const groups=[[10000000,'crore'],[100000,'lakh'],[1000,'thousand'],[1,'']];let out=[];for(const [size,label] of groups){const part=Math.floor(n/size);if(part){out.push(smallWords(part)+(label?' '+label:''));n%=size}}return out.join(' ')}
    function amountInWords(value,currency){const phrase=(numbering.value==='indian'?indianWords:internationalWords)(value);return `${phrase} ${currencyUnits[currency]||currency}.`;}
    function setStatus(msg,error=false){status.textContent=msg;status.className='status'+(error?' error':'')}
    function sanitize(){const raw=amount.value.replace(/,/g,'').trim(), n=Number(raw);if(!raw||!Number.isFinite(n)||n<0)throw Error('Enter a valid amount of zero or more.');return n}
    async function convert(){let input;try{input=sanitize()}catch(e){setStatus(e.message,true);return}button.disabled=true;button.textContent='Fetching live rate…';setStatus('Updating exchange rate…');try{const response=await fetch(`${BASE_URL}/${from.value}`);if(!response.ok)throw Error();const data=await response.json();const r=data.rates?.[to.value];if(!data.result||!r)throw Error();const result=input*r;total.textContent=formatter(result,to.value);words.textContent=amountInWords(result,to.value);rate.textContent=`1 ${from.value} = ${new Intl.NumberFormat(undefined,{maximumSignificantDigits:8}).format(r)} ${to.value} · Live ExchangeRate-API rate`;setStatus('Rate updated successfully.');}catch{total.textContent='Unavailable';words.textContent='We could not retrieve a live rate. Check your connection and try again.';rate.textContent='Exchange-rate service unavailable.';setStatus('Unable to fetch the live exchange rate. Please try again.',true)}finally{button.disabled=false;button.textContent='Convert currency'}}
    $('converter').addEventListener('submit',e=>{e.preventDefault();convert()});$('swap').addEventListener('click',()=>{[from.value,to.value]=[to.value,from.value];$('inputCode').textContent=from.value;convert()});from.addEventListener('change',()=>{$('inputCode').textContent=from.value});to.addEventListener('change',convert);numbering.addEventListener('change',convert);amount.addEventListener('keydown',e=>{if(e.key==='Enter')convert()});convert();
  })();
  </script>
</body>
</html>
