<style>
  :root{
    --page:#F2F7FD;
    --page-alt:#E8F1FB;
    --card:#FFFFFF;
    --card-alt:#F4F9FE;
    --ink:#12213C;
    --ink-soft:#4C5E7D;
    --ink-faint:#93A4C0;
    --hair:#D9E6F7;
    --hair-strong:#B9D0EC;
    --blue:#0D47A1;
    --blue-deep:#082A5E;
    --blue-soft:#E3EDFB;
    --pink:#D14D82;
    --pink-deep:#A03565;
    --pink-soft:#FCE4EE;
    --cream-ink:#F5F9FF;
    --red:#B23A33;
    --red-soft:#F5E1DD;
    --green:#2E7D4F;
    --green-soft:#E1F1E7;
    --shadow-sm:0 1px 2px rgba(13,40,90,0.06), 0 1px 1px rgba(13,40,90,0.04);
    --shadow-md:0 10px 24px rgba(8,42,94,0.10), 0 2px 8px rgba(8,42,94,0.06);
    --shadow-lg:0 20px 48px rgba(8,42,94,0.22);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:11px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope','Noto Sans Devanagari', sans-serif;
    font-weight:500;
    color:var(--ink);
    background:
      radial-gradient(ellipse at 15% 8%, rgba(13,71,161,0.06) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 92%, rgba(209,77,130,0.06) 0%, transparent 45%),
      var(--page);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .cow-print{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.55;
    background-image:
      radial-gradient(ellipse 46px 34px at 8% 12%, rgba(13,71,161,0.045) 40%, transparent 41%),
      radial-gradient(ellipse 60px 40px at 72% 6%, rgba(13,71,161,0.04) 40%, transparent 41%),
      radial-gradient(ellipse 38px 50px at 40% 30%, rgba(13,71,161,0.045) 40%, transparent 41%),
      radial-gradient(ellipse 55px 36px at 90% 40%, rgba(13,71,161,0.04) 40%, transparent 41%),
      radial-gradient(ellipse 42px 30px at 15% 55%, rgba(13,71,161,0.04) 40%, transparent 41%),
      radial-gradient(ellipse 64px 44px at 60% 68%, rgba(13,71,161,0.045) 40%, transparent 41%),
      radial-gradient(ellipse 36px 48px at 92% 82%, rgba(13,71,161,0.04) 40%, transparent 41%),
      radial-gradient(ellipse 50px 34px at 25% 90%, rgba(13,71,161,0.045) 40%, transparent 41%),
      radial-gradient(ellipse 40px 30px at 55% 95%, rgba(13,71,161,0.04) 40%, transparent 41%);
    background-size: 480px 480px;
    background-repeat:repeat;
  }
  .app{ position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:2.5rem;}
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .fade-in{ animation:fadeUp .32s ease both; }

  /* Header */
  .hdr{ background:var(--blue-deep); color:var(--cream-ink); border-bottom-left-radius:26px; border-bottom-right-radius:26px; box-shadow:var(--shadow-lg); position:relative; overflow:hidden; }

  .hdr-controls{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); right:16px; z-index:2; display:flex; gap:8px; }
  .lang-toggle{
    display:flex; border:1px solid rgba(245,249,255,0.28); border-radius:10px; overflow:hidden;
    background:rgba(8,42,94,0.35);
  }
  .lang-btn{
    border:none; background:transparent; color:#CFE0F7; font-size:11.5px; font-weight:700; padding:0 9px; height:38px;
    cursor:pointer; letter-spacing:0.3px; font-family:'Manrope', sans-serif;
  }
  .lang-btn.active{ background:var(--pink); color:#fff; }
  .gear-btn{
    width:38px; height:38px; border-radius:10px; border:1px solid rgba(245,249,255,0.28);
    background:rgba(8,42,94,0.35); display:flex; align-items:center; justify-content:center;
    color:var(--cream-ink); cursor:pointer; transition:transform .1s ease, background .15s ease; flex-shrink:0;
  }
  .gear-btn:active{ transform:scale(0.92) rotate(20deg); background:rgba(8,42,94,0.5); }

  .brand{ display:flex; align-items:center; gap:12px; position:relative; z-index:1; }
  .brand-mark{
    width:50px; height:50px; border-radius:50%; background:rgba(8,42,94,0.45);
    border:2px solid var(--pink); display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 2px 12px rgba(4,20,46,0.4);
  }
  .brand-text .title{
    font-family:'Fraunces', serif; font-weight:800; font-size:26px; letter-spacing:0.2px; line-height:1;
    text-shadow:0 2px 14px rgba(3,16,38,0.65);
  }
  .brand-text .sub{
    font-size:11px; color:#F6C9DC; text-transform:uppercase; letter-spacing:1.8px; margin-top:5px;
    font-weight:700; text-shadow:0 1px 8px rgba(3,16,38,0.55);
  }

  .hdr-body{ padding:14px 20px 20px; position:relative; background:linear-gradient(180deg, var(--blue) 0%, var(--blue-deep) 100%); }
  .hdr-body::before{
    content:""; position:absolute; inset:0; opacity:0.08; pointer-events:none;
    background-image:
      radial-gradient(ellipse 70px 50px at 10% 10%, #000 40%, transparent 41%),
      radial-gradient(ellipse 90px 60px at 80% -5%, #000 40%, transparent 41%),
      radial-gradient(ellipse 55px 75px at 45% 55%, #000 40%, transparent 41%),
      radial-gradient(ellipse 80px 55px at 95% 65%, #000 40%, transparent 41%);
  }
  .greeting{ font-size:13px; color:#CFE0F7; font-weight:600; position:relative; margin-bottom:10px; }
  .greeting b{ color:#fff; }

  .month-nav{ display:flex; align-items:center; justify-content:space-between; position:relative; }
  .month-btn{ background:none; border:none; color:#CFE0F7; cursor:pointer; padding:8px; border-radius:8px; transition:background .15s ease; }
  .month-btn:active{ background:rgba(245,249,255,0.1); }
  .month-label{ font-family:'Fraunces', serif; font-size:19px; font-weight:700; letter-spacing:0.3px; }

  .summary{ margin-top:16px; position:relative; background:rgba(246,241,226,0.07); border:1px solid rgba(246,241,226,0.16); border-radius:16px; padding:16px 18px 14px; }
  .summary-grid{ display:flex; }
  .summary-col{ flex:1; }
  .summary-divider{ width:1px; background:rgba(246,241,226,0.16); margin:2px 16px; }
  .summary-label{ font-size:10.5px; color:#B9CFEE; text-transform:uppercase; letter-spacing:1.2px; font-weight:700; }
  .summary-value{ font-family:'JetBrains Mono', monospace; font-size:22px; font-weight:700; margin-top:5px; }
  .summary-value .unit{ font-size:13px; color:#B9CFEE; font-weight:500;}
  .summary-sub{ font-size:11px; color:#8FA8C9; margin-top:3px; }

  .paid-stamp{ position:absolute; top:-13px; right:-8px; width:86px; height:86px; pointer-events:none; transform:rotate(14deg); opacity:0; transition:opacity .25s ease, transform .25s ease; filter:drop-shadow(0 4px 10px rgba(4,20,46,0.35)); }
  .paid-stamp.show{ opacity:0.94; transform:rotate(14deg) scale(1); }

  .paid-toggle{
    margin-top:12px; width:100%; padding:11px 0; border-radius:11px; cursor:pointer;
    font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:7px;
    border:1px solid rgba(245,249,255,0.22); background:rgba(245,249,255,0.06); color:#CFE0F7;
    transition:all .15s ease; letter-spacing:0.2px; font-family:inherit;
  }
  .paid-toggle.is-paid{ border-color:rgba(120,196,140,0.4); background:rgba(120,196,140,0.12); color:#8FCB9C; }
  .paid-toggle:active{ transform:scale(0.98); }

  /* Cards */
  .card{ background:var(--card); border:1px solid var(--hair); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); padding:20px 18px 22px; }
  .section-gap{ margin:22px 20px 0; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .card-title{ font-family:'Fraunces', serif; font-size:17px; font-weight:700; color:var(--ink); }
  .cancel-link{ font-size:12.5px; color:var(--ink-soft); background:none; border:none; cursor:pointer; display:flex; align-items:center; gap:4px; padding:4px; font-family:inherit; font-weight:600; }

  label.field-label{ display:block; font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px; font-weight:700; }
  input[type="date"], input[type="number"], input[type="text"]{
    font-family:'Manrope', sans-serif; font-weight:600; font-size:15px; color:var(--ink); background:var(--card-alt);
    border:1.5px solid var(--hair); border-radius:var(--radius-sm); padding:11px 13px; width:100%;
  }
  input:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft); }
  input[type="date"]::-webkit-calendar-picker-indicator{ filter: invert(20%) sepia(90%) saturate(1500%) hue-rotate(200deg); opacity:0.8;}

  .na-toggle{
    width:100%; margin-top:14px; padding:12px 14px; border-radius:12px; cursor:pointer; display:flex;
    align-items:center; justify-content:center; gap:8px; font-size:13.5px; font-weight:700;
    border:1.5px dashed var(--hair-strong); background:var(--card-alt); color:var(--ink-soft); font-family:inherit;
    transition:all .15s ease;
  }
  .na-toggle.active{ border:1.5px solid var(--red); background:var(--red-soft); color:var(--red); border-style:solid; }
  .na-note{ margin-top:12px; padding:12px 14px; background:var(--red-soft); border-radius:12px; font-size:12.5px; color:var(--red); text-align:center; font-weight:600; }

  .qty-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .rate-edit-link{ font-size:11.5px; color:var(--pink-deep); background:var(--pink-soft); border:none; cursor:pointer; font-family:'JetBrains Mono', monospace; padding:5px 10px; border-radius:999px; font-weight:700; }
  .rate-input-wrap{ margin-bottom:10px; }

  .stepper{ display:flex; align-items:center; gap:10px; }
  .step-btn{ width:46px; height:46px; border-radius:12px; border:1.5px solid var(--hair-strong); background:var(--card-alt); font-size:22px; color:var(--blue); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:transform .08s ease, background .15s ease; font-family:inherit; }
  .step-btn:active{ transform:scale(0.94); background:var(--blue-soft); }
  .qty-input{ flex:1; text-align:center; font-family:'JetBrains Mono', monospace; font-size:21px; font-weight:700; padding:11px 6px; border-radius:12px; border:1.5px solid var(--hair); background:var(--card-alt); color:var(--ink); }

  .chip-row{ display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; }
  .chip{ padding:6px 13px; border-radius:999px; font-size:13px; cursor:pointer; font-family:'JetBrains Mono', monospace; border:1.5px solid var(--hair); background:var(--card-alt); color:var(--ink-soft); transition:all .12s ease; font-weight:600; }
  .chip.active{ border-color:var(--blue); background:var(--blue-soft); color:var(--blue); font-weight:700; }

  .amount-preview{ margin-top:16px; padding:13px 15px; background:var(--blue-soft); border-radius:12px; display:flex; align-items:center; justify-content:space-between; border:1px solid #C9DBF4; }
  .amount-preview .lbl{ font-size:12.5px; color:var(--blue); font-weight:700; }
  .amount-preview .val{ font-family:'JetBrains Mono', monospace; font-size:19px; font-weight:700; color:var(--blue-deep); }

  .submit-btn{
    margin-top:14px; width:100%; padding:14px 0; border-radius:13px; border:none; cursor:pointer;
    background:linear-gradient(180deg, var(--blue) 0%, var(--blue-deep) 100%); color:var(--cream-ink);
    font-size:15px; font-weight:700; letter-spacing:0.3px; display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:var(--shadow-sm); transition:transform .08s ease; font-family:inherit;
  }
  .submit-btn:active{ transform:scale(0.98); }

  /* Ledger */
  .ledger-count{ font-size:11.5px; color:var(--ink-faint); font-family:'JetBrains Mono', monospace; font-weight:700; }
  .ledger-card{ background:var(--card); border:1px solid var(--hair); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-md); }
  .ledger-empty{ background:var(--card); border:1.5px dashed var(--hair-strong); border-radius:var(--radius-lg); padding:36px 18px; text-align:center; color:var(--ink-soft); font-size:13.5px; line-height:1.6; font-weight:600; }
  .row{ display:flex; align-items:center; padding:13px 16px; border-bottom:1px solid var(--hair); }
  .row:nth-child(even){ background:var(--card-alt); }
  .row.is-na{ opacity:0.82; }
  .row-date{ flex:1.3; }
  .row-date .d1{ font-size:13.5px; color:var(--ink); font-weight:700; }
  .row-date .d2{ font-size:11px; color:var(--ink-faint); font-family:'JetBrains Mono', monospace; margin-top:1px; font-weight:600; }
  .row-date .d2.na-label{ color:var(--red); font-family:'Manrope', sans-serif; font-style:italic; }
  .row-date .d3{ font-size:10px; color:var(--pink-deep); margin-top:2px; font-weight:600; font-style:italic; }
  .row-amt{ flex:1; text-align:right; font-family:'JetBrains Mono', monospace; font-size:14.5px; font-weight:700; color:var(--ink); margin-right:8px; }
  .row-amt.na{ color:var(--ink-faint); font-weight:600; }
  .row-actions{ display:flex; gap:2px; }
  .icon-btn{ width:32px; height:32px; border-radius:9px; border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s ease; }
  .icon-btn.edit{ color:var(--blue); }
  .icon-btn.del{ color:var(--red); }
  .icon-btn:active{ background:var(--blue-soft); }
  .confirm-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:var(--red-soft); border-bottom:1px solid var(--hair); }
  .confirm-row span{ font-size:12.5px; color:var(--red); font-weight:600; }
  .confirm-actions{ display:flex; gap:8px; }
  .confirm-actions button{ font-size:12px; padding:6px 11px; border-radius:8px; cursor:pointer; font-weight:700; font-family:inherit; }
  .btn-keep{ border:1px solid var(--hair-strong); background:var(--card); color:var(--ink-soft); }
  .btn-del{ border:none; background:var(--red); color:#FDF2EF; }
  .ledger-total{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:linear-gradient(180deg, var(--blue) 0%, var(--blue-deep) 100%); color:var(--cream-ink); }
  .ledger-total .lbl{ font-size:12.5px; color:#B9CFEE; font-weight:700; }
  .ledger-total .val{ font-family:'JetBrains Mono', monospace; font-size:16px; font-weight:700; }

  .receipt-btn{
    margin-top:12px; width:100%; padding:13px 0; border-radius:13px; cursor:pointer; display:flex;
    align-items:center; justify-content:center; gap:8px; font-size:14px; font-weight:700; font-family:inherit;
    border:1.5px solid var(--blue); background:#fff; color:var(--blue); transition:transform .08s ease;
  }
  .receipt-btn:active{ transform:scale(0.98); background:var(--blue-soft); }

  .storage-warn{ margin:16px 20px 0; padding:11px 15px; background:var(--pink-soft); border:1px solid #EFC1D6; border-radius:12px; font-size:12px; color:var(--pink-deep); line-height:1.5; font-weight:600; }
  .footer-note{ text-align:center; font-size:11.5px; color:var(--ink-faint); margin-top:26px; letter-spacing:0.3px; font-weight:600; }

  /* Settings sheet */
  .overlay{ position:fixed; inset:0; background:rgba(8,20,42,0.5); z-index:50; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{ background:var(--card); width:100%; max-width:480px; border-top-left-radius:24px; border-top-right-radius:24px; padding:14px 22px calc(env(safe-area-inset-bottom,0px) + 22px); transform:translateY(30px); transition:transform .25s ease; box-shadow:var(--shadow-lg); max-height:88vh; overflow-y:auto; }
  .overlay.open .sheet{ transform:translateY(0); }
  .sheet-handle{ width:38px; height:4px; background:var(--hair-strong); border-radius:4px; margin:0 auto 18px; }
  .sheet-title{ font-family:'Fraunces', serif; font-size:19px; font-weight:700; margin-bottom:16px; }
  .field-row{ display:flex; gap:10px; }
  .field-row > div{ flex:1; }
  .field-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:7px; line-height:1.5; font-weight:600; }
  .field-block{ margin-bottom:14px; }
  .lang-row{ display:flex; gap:8px; }
  .lang-row button{
    flex:1; padding:11px 0; border-radius:11px; border:1.5px solid var(--hair-strong); background:var(--card-alt);
    color:var(--ink-soft); font-weight:700; cursor:pointer; font-family:inherit; font-size:13.5px;
  }
  .lang-row button.active{ border-color:var(--blue); background:var(--blue-soft); color:var(--blue); }
  .sheet-actions{ display:flex; gap:10px; margin-top:22px; }
  .sheet-actions button{ padding:13px 0; border-radius:12px; font-size:14.5px; cursor:pointer; font-family:inherit; }
  .btn-cancel{ flex:1; border:1.5px solid var(--hair-strong); background:var(--card); color:var(--ink-soft); font-weight:700; }
  .btn-save{ flex:1.5; border:none; background:linear-gradient(180deg, var(--blue), var(--blue-deep)); color:var(--cream-ink); font-weight:700; }

  /* Toast */
  .toast{ position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); left:50%; transform:translateX(-50%) translateY(10px); background:var(--blue-deep); color:var(--cream-ink); padding:11px 20px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); z-index:60; white-space:nowrap; opacity:0; pointer-events:none; transition:all .25s ease; border:1px solid var(--pink); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading-wrap{ display:flex; align-items:center; justify-content:center; min-height:70vh; color:var(--ink-soft); font-size:14px; font-weight:600; }

  /* Onboarding */
  .onboard{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; z-index:1; }
  .onboard-card{ background:var(--card); border-radius:26px; box-shadow:var(--shadow-lg); padding:34px 26px 28px; max-width:400px; width:100%; text-align:center; border:1px solid var(--hair); }
  .onboard-icon{ width:76px; height:76px; border-radius:50%; background:var(--blue-soft); border:2px solid var(--pink); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  .onboard-title{ font-family:'Fraunces', serif; font-weight:800; font-size:24px; color:var(--blue-deep); margin-bottom:6px; }
  .onboard-sub{ font-size:13.5px; color:var(--ink-soft); margin-bottom:22px; font-weight:600; line-height:1.5; }
  .onboard-input{ margin-bottom:16px; text-align:center; font-size:17px !important; padding:13px !important; }
  .onboard-btn{ width:100%; padding:14px 0; border-radius:13px; border:none; cursor:pointer; background:linear-gradient(180deg, var(--blue), var(--blue-deep)); color:#fff; font-size:15px; font-weight:700; font-family:inherit; box-shadow:var(--shadow-sm); }
  .onboard-btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .onboard-skip{ margin-top:14px; background:none; border:none; color:var(--ink-faint); font-size:12.5px; cursor:pointer; font-weight:600; text-decoration:underline; font-family:inherit; }
  .onboard-lang-wrap{ display:flex; justify-content:center; margin-bottom:22px; }
  .lang-switch{ position:relative; display:flex; width:188px; height:42px; background:var(--card-alt); border:1.5px solid var(--hair-strong); border-radius:999px; padding:3px; }
  .lang-switch .switch-knob{ position:absolute; top:3px; left:3px; width:calc(50% - 3px); height:calc(100% - 6px); background:linear-gradient(180deg, var(--blue), var(--blue-deep)); border-radius:999px; transition:transform .28s cubic-bezier(.4,0,.2,1); box-shadow:0 2px 8px rgba(8,42,94,0.35); }
  .lang-switch.is-hi .switch-knob{ transform:translateX(100%); }
  .lang-switch button{ position:relative; z-index:1; flex:1; border:none; background:transparent; font-weight:700; font-size:13px; cursor:pointer; color:var(--ink-soft); font-family:inherit; transition:color .2s ease; }
  .lang-switch button.switch-active{ color:#fff; }

  @media (min-width:481px){
    body{ background: radial-gradient(ellipse at 15% 8%, rgba(13,71,161,0.05) 0%, transparent 45%), radial-gradient(ellipse at 85% 92%, rgba(209,77,130,0.06) 0%, transparent 45%), var(--page-alt); }
    .app{ margin-top:24px; margin-bottom:24px; border-radius:28px; overflow:hidden; box-shadow:var(--shadow-lg); }
  }
</style>
</head>

  function pad2(n){ return String(n).padStart(2,"0"); }
  function toKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function todayStr(){ return toKey(new Date()); }
  function monthKeyOf(dateStr){ return dateStr.slice(0,7); }
  function fmtNum(n){ var r=Math.round(n*100)/100; return (r%1===0)?String(r):String(r.toFixed(2)).replace(/0$/,""); }
  function fmtMoney(n,cur){ var r=Math.round(n*100)/100; return cur+r.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtMoneyPlain(n){ var r=Math.round(n*100)/100; return r.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function monthName(idx){ return (state.lang==="hi"?MONTH_NAMES_HI:MONTH_NAMES)[idx]; }
  function dayName(idx){ return (state.lang==="hi"?DAY_NAMES_HI:DAY_NAMES)[idx]; }
  function fmtDateLabel(dateStr){
    var p=dateStr.split("-").map(Number); var dt=new Date(p[0],p[1]-1,p[2]);
    return dayName(dt.getDay())+", "+dt.getDate()+" "+monthName(p[1]-1).slice(0, state.lang==="hi"?4:3);
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }
  function t(key){ var d=I18N[state.lang]||I18N.en; return (d[key]!==undefined)?d[key]:(I18N.en[key]||key); }

  function showToast(msg){
    var el=document.getElementById("toast"); if(!el) return;
    el.textContent=msg; el.classList.add("show");
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ el.classList.remove("show"); },2200);
  }

  async function loadData(){
    var loadedEntries=[]; var loadedSettings=Object.assign({},DEFAULT_SETTINGS); var ok=true;
    try{
      if(!window.storage) ok=false;
      else{
        try{ var r1=await window.storage.get("milky_entries",false); if(r1&&r1.value) loadedEntries=JSON.parse(r1.value); }catch(e){}
        try{ var r2=await window.storage.get("milky_settings",false); if(r2&&r2.value) loadedSettings=Object.assign({},DEFAULT_SETTINGS,JSON.parse(r2.value)); }catch(e){}
        try{
          var legacy=await window.storage.get("milklog_entries",false);
          if(legacy&&legacy.value&&loadedEntries.length===0){ loadedEntries=JSON.parse(legacy.value); }
        }catch(e){}
      }
    }catch(e){ ok=false; }
    state.entries=loadedEntries; state.settings=loadedSettings;
    state.lang = loadedSettings.lang || "en";
    state.formRate=loadedSettings.rate; state.storageOk=ok;
    resetFormDefaults(); state.ready=true; render();
  }

  async function persistEntries(next){ state.entries=next; try{ await window.storage.set("milky_entries",JSON.stringify(next),false);}catch(e){ showToast("\u26a0 "+t("toastEnterQty")); } }
  async function persistSettings(next){ state.settings=next; try{ await window.storage.set("milky_settings",JSON.stringify(next),false);}catch(e){} }

  function currentMonthKey(){ return state.viewYear+"-"+pad2(state.viewMonth+1); }
  function isCurrentCalendarMonth(){ var n=new Date(); return n.getFullYear()===state.viewYear && n.getMonth()===state.viewMonth; }
  function monthEntries(){
    var mk=currentMonthKey();
    return state.entries.filter(function(e){return monthKeyOf(e.date)===mk;}).sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);});
  }
  function existingForDate(dateStr,excludeId){ return state.entries.find(function(e){return e.date===dateStr && e.id!==excludeId;}); }

  function resetFormDefaults(){
    state.editingId=null;
    var sorted=state.entries.slice().sort(function(a,b){return a.date<b.date?1:-1;});
    var last=sorted.find(function(e){return !e.na;});
    state.formDate=isCurrentCalendarMonth()?todayStr():(currentMonthKey()+"-01");
    state.formQty=last?last.qty:1; state.formRate=state.settings.rate; state.formNA=false; state.rateEditOpen=false;
  }

  function handleDateChange(val){
    state.formDate=val;
    var match=existingForDate(val,state.editingId);
    if(match){ state.editingId=match.id; state.formQty=match.qty; state.formRate=match.rate; state.formNA=!!match.na; }
    else if(state.editingId){
      var still=state.entries.find(function(e){return e.id===state.editingId;});
      if(still && still.date!==val){ state.editingId=null; }
    }
    render();
  }

  function startEdit(id){
    var entry=state.entries.find(function(e){return e.id===id;}); if(!entry) return;
    state.editingId=id; state.formDate=entry.date; state.formQty=entry.qty; state.formRate=entry.rate;
    state.formNA=!!entry.na; state.rateEditOpen=false; state.deleteConfirmId=null;
    render();
    var card=document.getElementById("entry-card"); if(card) card.scrollIntoView({behavior:"smooth",block:"start"});
  }

  function cancelEdit(){ resetFormDefaults(); render(); }

  function toggleNA(){ state.formNA=!state.formNA; render(); }

  async function submitForm(){
    if(!state.formDate){ showToast(t("toastPickDate")); return; }
    if(!state.formNA){
      if(!state.formQty||state.formQty<=0){ showToast(t("toastEnterQty")); return; }
      if(!state.formRate||state.formRate<=0){ showToast(t("toastEnterRate")); return; }
    }
    var existing=existingForDate(state.formDate,state.editingId);
    var targetId=state.editingId||(existing?existing.id:null);
    var payload = state.formNA
      ? { date:state.formDate, qty:0, rate:0, na:true, by:state.settings.userName||"" }
      : { date:state.formDate, qty:state.formQty, rate:state.formRate, na:false, by:state.settings.userName||"" };
    var next;
    if(targetId){
      next=state.entries.map(function(e){ return e.id===targetId?Object.assign({},e,payload):e; });
      await persistEntries(next); showToast(t("toastUpdated"));
    } else {
      next=state.entries.concat([Object.assign({id:uid()},payload)]);
      await persistEntries(next); showToast(t("toastAdded"));
    }
    resetFormDefaults(); render();
  }

  async function deleteEntry(id){
    var next=state.entries.filter(function(e){return e.id!==id;});
    await persistEntries(next); state.deleteConfirmId=null;
    if(state.editingId===id) resetFormDefaults();
    showToast(t("toastDeleted")); render();
  }

  async function togglePaid(){
    var mk=currentMonthKey(); var isPaid=!!state.settings.payments[mk];
    var payments=Object.assign({},state.settings.payments); payments[mk]=!isPaid;
    await persistSettings(Object.assign({},state.settings,{payments:payments}));
    showToast(!isPaid?t("toastPaid"):t("toastPending")); render();
  }

  function changeMonth(delta){
    var d=new Date(state.viewYear,state.viewMonth+delta,1);
    state.viewYear=d.getFullYear(); state.viewMonth=d.getMonth(); state.deleteConfirmId=null; render();
  }

  function adjustQty(delta){ state.formQty=Math.max(0.5,Math.round((state.formQty+delta)*2)/2); render(); }

  function setLang(lang){
    state.lang=lang;
    persistSettings(Object.assign({},state.settings,{lang:lang}));
    render();
  }

  function openSettings(){
    state.settingsDraft={ rate:state.settings.rate, dairyName:state.settings.dairyName, userName:state.settings.userName, lang:state.lang };
    state.settingsOpen=true; render();
  }
  function saveSettings(){
    var rate=parseFloat(state.settingsDraft.rate)||DEFAULT_SETTINGS.rate;
    var dairyName=state.settingsDraft.dairyName||DEFAULT_SETTINGS.dairyName;
    var userName=(state.settingsDraft.userName||"").trim();
    var lang=state.settingsDraft.lang||state.lang;
    state.lang=lang;
    persistSettings(Object.assign({},state.settings,{rate:rate,dairyName:dairyName,userName:userName,lang:lang}));
    state.settingsOpen=false; showToast(t("toastSettingsSaved")); render();
  }

  /* ---------- Onboarding ---------- */
  function completeOnboarding(name){
    var finalName=(name||"").trim();
    persistSettings(Object.assign({},state.settings,{userName:finalName||"Friend"}));
    render();
  }

  /* ---------- Receipt (PDF) ---------- */
  function downloadReceipt(){
    if(!window.jspdf || !window.jspdf.jsPDF){ showToast("PDF library unavailable"); return; }
    var chron=monthEntries().slice().sort(function(a,b){return a.date<b.date?-1:1;});
    if(chron.length===0){ showToast(t("toastNoEntries")); return; }
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF({unit:"mm",format:"a4"});

    /* Embed a Roboto subset so the \u20b9 Rupee sign renders correctly
       (the standard PDF fonts have no glyph for it). */
    var hasCustomFont=false;
    try{
      doc.addFileToVFS("Roboto-Regular.ttf", ROBOTO_REGULAR_B64);
      doc.addFont("Roboto-Regular.ttf","Roboto","normal");
      doc.addFileToVFS("Roboto-Bold.ttf", ROBOTO_BOLD_B64);
      doc.addFont("Roboto-Bold.ttf","Roboto","bold");
      hasCustomFont=true;
    }catch(e){ hasCustomFont=false; }
    var FONT = hasCustomFont ? "Roboto" : "helvetica";
    var cur = hasCustomFont ? (state.settings.currency||CUR_DEFAULT) : "Rs.";

    var mk=currentMonthKey();
    var monthLabel=MONTH_NAMES[state.viewMonth]+" "+state.viewYear;
    var isPaid=!!state.settings.payments[mk];

    doc.setFillColor(13,71,161); doc.rect(0,0,210,32,"F");
    doc.setTextColor(255,255,255); doc.setFont(FONT,"bold"); doc.setFontSize(22);
    doc.text("Milky",15,17);
    doc.setFontSize(10); doc.setFont(FONT,"normal");
    doc.text(state.settings.dairyName||"Daily Dairy",15,25);
    doc.setFontSize(13); doc.setFont(FONT,"bold");
    doc.text("Receipt - "+monthLabel,195,17,{align:"right"});
    doc.setFontSize(10); doc.setFont(FONT,"normal");
    doc.text(isPaid?"Status: Paid":"Status: Pending",195,25,{align:"right"});

    var y=44;
    doc.setTextColor(18,33,60); doc.setFont(FONT,"bold"); doc.setFontSize(9.5);
    doc.text("Date",15,y); doc.text("Qty (L)",108,y,{align:"right"}); doc.text("Rate",140,y,{align:"right"}); doc.text("Amount",195,y,{align:"right"});
    y+=3; doc.setDrawColor(190,205,235); doc.line(15,y,195,y); y+=6;

    doc.setFont(FONT,"normal"); doc.setFontSize(9.5);
    var totalQty=0, totalAmt=0;
    chron.forEach(function(e,idx){
      if(idx%2===1){ doc.setFillColor(243,247,255); doc.rect(15,y-4.3,180,6.3,"F"); }
      doc.setTextColor(35,45,65);
      var dateStr=fmtDateLabel(e.date).replace(/[^\x00-\x7F]/g,"");
      if(e.by){ dateStr += "  \u00b7  "+e.by; }
      doc.text(dateStr,15,y);
      if(e.na){
        doc.setTextColor(160,60,60);
        doc.text("No delivery",195,y,{align:"right"});
      } else {
        doc.setTextColor(35,45,65);
        doc.text(fmtNum(e.qty),108,y,{align:"right"});
        doc.text(cur+fmtNum(e.rate),140,y,{align:"right"});
        doc.text(cur+fmtMoneyPlain(e.qty*e.rate),195,y,{align:"right"});
        totalQty+=e.qty; totalAmt+=e.qty*e.rate;
      }
      y+=7.2;
      if(y>270){ doc.addPage(); y=20; }
    });

    y+=3; doc.setDrawColor(13,71,161); doc.setLineWidth(0.7); doc.line(15,y,195,y); y+=9;
    doc.setFont(FONT,"bold"); doc.setFontSize(12.5); doc.setTextColor(13,71,161);
    doc.text("Total:",140,y,{align:"right"});
    doc.text(fmtNum(totalQty)+"L   "+cur+fmtMoneyPlain(totalAmt),195,y,{align:"right"});

    y+=13; doc.setFont(FONT,"normal"); doc.setFontSize(8.5); doc.setTextColor(130,140,160);
    doc.text("Generated on "+new Date().toLocaleDateString(),15,y);
    if(state.settings.userName){ doc.text("Logged by: "+state.settings.userName,15,y+5); }

    doc.save("Milky-Receipt-"+mk+".pdf");
    showToast(t("toastReceiptDown"));
  }

  function iconGear(size,color){
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none">'
      +'<path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="'+color+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
      +'<circle cx="12" cy="12" r="3" stroke="'+color+'" stroke-width="1.6"/></svg>';
  }
  function iconChevron(dir){ var d=dir==="left"?"M14 5l-7 7 7 7":"M10 5l7 7-7 7"; return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="'+d+'" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function iconCheck(size){ return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function iconPlus(size){ return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'; }
  function iconX(size){ return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>'; }
  function iconPencil(size){ return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none"><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>'; }
  function iconTrash(size){ return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4.8c0-.4.4-.8.9-.8h4.2c.5 0 .9.4.9.8V7M6 7l1 13.2c0 .5.5.8 1 .8h8c.5 0 1-.3 1-.8L18 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function iconDownload(size){ return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4.5 19.5h15" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function iconBan(size){ return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M6 6l12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'; }
  function iconStamp(){
    return '<svg width="86" height="86" viewBox="0 0 100 100">'
      +'<circle cx="50" cy="50" r="47" fill="#FFFFFF" opacity="0.96"/>'
      +'<circle cx="50" cy="50" r="46" fill="none" stroke="#8E1E4C" stroke-width="3.2" stroke-dasharray="4 3"/>'
      +'<circle cx="50" cy="50" r="36" fill="none" stroke="#8E1E4C" stroke-width="2.4"/>'
      +'<text x="50" y="47" text-anchor="middle" font-family="Georgia, serif" font-weight="800" font-size="17" fill="#8E1E4C" letter-spacing="2">PAID</text>'
      +'<text x="50" y="63" text-anchor="middle" font-family="monospace" font-weight="700" font-size="7" fill="#0D47A1" letter-spacing="1">SETTLED IN FULL</text>'
      +'</svg>';
  }

  /* ---------- Render: Onboarding ---------- */
  function renderOnboarding(){
    var app=document.getElementById("app");
    var lang=state.lang;
    var html='<div class="onboard fade-in"><div class="onboard-card">';
    html+='<div class="onboard-lang-wrap"><div class="lang-switch'+(lang==="hi"?" is-hi":"")+'">';
    html+='<div class="switch-knob"></div>';
    html+='<button class="'+(lang==="en"?"switch-active":"")+'" id="ob-lang-en">EN</button>';
    html+='<button class="'+(lang==="hi"?"switch-active":"")+'" id="ob-lang-hi">\u0939\u093f\u0902\u0926\u0940</button>';
    html+='</div></div>';
    html+='<div class="onboard-icon">'+iconCow(40,"#0D47A1","#D14D82")+'</div>';
    html+='<div class="onboard-title">'+t("welcomeTitle")+'</div>';
    html+='<div class="onboard-sub">'+t("welcomeSub")+'</div>';
    html+='<input type="text" class="onboard-input" id="ob-name-input" placeholder="'+escapeHtml(t("namePlaceholder"))+'" value="'+escapeHtml(state.onboardName)+'" autofocus />';
    html+='<button class="onboard-btn" id="ob-continue">'+t("continueBtn")+'</button>';
    html+='<button class="onboard-skip" id="ob-skip">'+t("skipBtn")+'</button>';
    html+='</div></div>';
    app.innerHTML=html;

    document.getElementById("ob-lang-en").addEventListener("click",function(){ state.lang="en"; render(); });
    document.getElementById("ob-lang-hi").addEventListener("click",function(){ state.lang="hi"; render(); });
    var inp=document.getElementById("ob-name-input");
    var btn=document.getElementById("ob-continue");
    inp.addEventListener("input",function(e){ state.onboardName=e.target.value; });
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter") completeOnboarding(state.onboardName); });
    btn.addEventListener("click",function(){ completeOnboarding(state.onboardName); });
    document.getElementById("ob-skip").addEventListener("click",function(){ completeOnboarding(""); });
    setTimeout(function(){ try{ inp.focus(); }catch(e){} },50);
  }

  /* ---------- Render: Main ---------- */
  function render(){
    var app=document.getElementById("app");
    if(!state.ready){ app.innerHTML='<div class="loading-wrap">Loading Milky&hellip;</div>'; return; }
    if(!state.settings.userName){ renderOnboarding(); return; }

    var entries=monthEntries();
    var delivered=entries.filter(function(e){return !e.na;});
    var naEntries=entries.filter(function(e){return e.na;});
    var totalQty=delivered.reduce(function(s,e){return s+e.qty;},0);
    var totalAmount=delivered.reduce(function(s,e){return s+e.qty*e.rate;},0);
    var mk=currentMonthKey();
    var isPaid=!!state.settings.payments[mk];
    var currency=state.settings.currency||CUR_DEFAULT;
    var isEditing=!!state.editingId;
    var previewAmount=(state.formQty||0)*(state.formRate||0);
    var lang=state.lang;

    var daysSub = naEntries.length>0
      ? (delivered.length+" \u00b7 "+naEntries.length+" N/A")
      : (delivered.length+(lang==="hi"?" \u0926\u093f\u0928 \u0926\u0930\u094d\u091c":(delivered.length===1?" day logged":" days logged")));

    var html='';

    html+='<div class="hdr">';
    html+='<div class="hero-photo">';
    html+='<div class="hdr-controls">';
    html+='<div class="lang-toggle"><button class="lang-btn '+(lang==="en"?"active":"")+'" id="btn-lang-en">EN</button><button class="lang-btn '+(lang==="hi"?"active":"")+'" id="btn-lang-hi">\u0939\u093f</button></div>';
    html+='<button class="gear-btn" id="btn-settings" aria-label="Settings">'+iconGear(19,"#F6F1E2")+'</button>';
    html+='</div>';
    html+='<div class="brand"><div class="brand-mark">'+iconCow(30,"#F5F9FF","#F48FB1")+'</div>';
    html+='<div class="brand-text"><div class="title">'+t("brand")+'</div><div class="sub">'+escapeHtml(state.settings.dairyName)+'</div></div></div>';
    html+='</div>'; // hero-photo

    html+='<div class="hdr-body">';
    if(state.settings.userName){
      html+='<div class="greeting">'+t("greetingPrefix")+' <b>'+escapeHtml(state.settings.userName)+'</b></div>';
    }
    html+='<div class="month-nav"><button class="month-btn" id="btn-prev-month" aria-label="Previous month">'+iconChevron("left")+'</button>';
    html+='<div class="month-label">'+monthName(state.viewMonth)+' '+state.viewYear+'</div>';
    html+='<button class="month-btn" id="btn-next-month" aria-label="Next month">'+iconChevron("right")+'</button></div>';

    html+='<div class="summary">';
    html+='<div class="paid-stamp'+(isPaid?" show":"")+'">'+iconStamp()+'</div>';
    html+='<div class="summary-grid">';
    html+='<div class="summary-col"><div class="summary-label">'+t("totalMilk")+'</div><div class="summary-value">'+fmtNum(totalQty)+' <span class="unit">L</span></div><div class="summary-sub">'+daysSub+'</div></div>';
    html+='<div class="summary-divider"></div>';
    html+='<div class="summary-col"><div class="summary-label">'+t("amountDue")+'</div><div class="summary-value" style="color:'+(isPaid?"#8FCB9C":"#FF9EC4")+'">'+fmtMoney(totalAmount,currency)+'</div><div class="summary-sub">@ '+currency+fmtNum(state.settings.rate)+'/L</div></div>';
    html+='</div>';
    html+='<button class="paid-toggle'+(isPaid?" is-paid":"")+'" id="btn-toggle-paid">'+(isPaid?iconCheck(14):"")+" "+(isPaid?t("paidThisMonth"):t("markPaid"))+'</button>';
    html+='</div>'; // summary
    html+='</div>'; // hdr-body
    html+='</div>'; // hdr

    /* Entry form */
    html+='<div class="section-gap"><div class="card fade-in" id="entry-card">';
    html+='<div class="card-head"><div class="card-title">'+(isEditing?t("updateEntryTitle"):t("todaysDelivery"))+'</div>';
    if(isEditing) html+='<button class="cancel-link" id="btn-cancel-edit">'+iconX(13)+' '+t("cancel")+'</button>';
    html+='</div>';

    html+='<label class="field-label">'+t("dateLabel")+'</label>';
    html+='<input type="date" id="input-date" value="'+state.formDate+'" />';

    html+='<button class="na-toggle'+(state.formNA?" active":"")+'" id="btn-toggle-na">'+iconBan(15)+' '+t("noDelivery")+'</button>';

    if(state.formNA){
      html+='<div class="na-note">'+t("noDeliveryNote")+'</div>';
    } else {
      html+='<div style="margin-top:16px;">';
      html+='<div class="qty-row"><label class="field-label" style="margin:0;">'+t("quantityLabel")+'</label>';
      html+='<button class="rate-edit-link" id="btn-toggle-rate">@ '+currency+fmtNum(state.formRate)+'/L &#9998;</button></div>';
      if(state.rateEditOpen){
        html+='<div class="rate-input-wrap"><input type="number" min="0" step="0.5" id="input-rate" value="'+state.formRate+'" placeholder="'+escapeHtml(t("editRate"))+'" /></div>';
      }
      html+='<div class="stepper"><button class="step-btn" id="btn-qty-minus" aria-label="Decrease">&minus;</button>';
      html+='<input type="number" min="0" step="0.5" class="qty-input" id="input-qty" value="'+state.formQty+'" />';
      html+='<button class="step-btn" id="btn-qty-plus" aria-label="Increase">+</button></div>';
      html+='<div class="chip-row">';
      [0.5,1,1.5,2,2.5].forEach(function(v){ html+='<button class="chip'+(state.formQty===v?" active":"")+'" data-qty="'+v+'">'+fmtNum(v)+'L</button>'; });
      html+='</div></div>';
      html+='<div class="amount-preview"><span class="lbl">'+t("amountLabel")+'</span><span class="val">'+fmtMoney(previewAmount,currency)+'</span></div>';
    }

    html+='<button class="submit-btn" id="btn-submit">'+(isEditing?iconCheck(15):iconPlus(15))+' '+(isEditing?t("updateEntry"):t("addEntry"))+'</button>';
    html+='</div></div>';

    /* Ledger */
    html+='<div class="section-gap">';
    html+='<div class="card-head" style="padding:0 2px;"><div class="card-title">'+t("entriesTitle")+'</div><div class="ledger-count">'+entries.length+'</div></div>';
    if(entries.length===0){
      html+='<div class="ledger-empty">'+iconMilk(28,"#93A4C0")+'<div style="margin-top:10px;">'+t("emptyLine1")+'<br/>'+t("emptyLine2")+'</div></div>';
    } else {
      html+='<div class="ledger-card fade-in">';
      entries.forEach(function(entry,idx){
        var last=idx===entries.length-1;
        html+='<div class="row'+(entry.na?" is-na":"")+'" data-row-id="'+entry.id+'"'+(last?' style="border-bottom:none;"':"")+'>';
        html+='<div class="row-date"><div class="d1">'+fmtDateLabel(entry.date)+'</div>';
        html+= entry.na
          ? '<div class="d2 na-label">'+t("noDeliveryRow")+'</div>'
          : '<div class="d2">'+fmtNum(entry.qty)+'L @ '+currency+fmtNum(entry.rate)+'</div>';
        if(entry.by){ html+='<div class="d3">'+t("byLabel")+" "+escapeHtml(entry.by)+'</div>'; }
        html+='</div>';
        html+='<div class="row-amt'+(entry.na?" na":"")+'">'+(entry.na?"\u2014":fmtMoney(entry.qty*entry.rate,currency))+'</div>';
        html+='<div class="row-actions"><button class="icon-btn edit" data-edit-id="'+entry.id+'" aria-label="Edit">'+iconPencil(15)+'</button>';
        html+='<button class="icon-btn del" data-del-id="'+entry.id+'" aria-label="Delete">'+iconTrash(15)+'</button></div>';
        html+='</div>';
        if(state.deleteConfirmId===entry.id){
          html+='<div class="confirm-row"'+(last?' style="border-bottom:none;"':"")+'><span>'+t("deleteConfirm")+'</span>';
          html+='<div class="confirm-actions"><button class="btn-keep" data-keep-id="'+entry.id+'">'+t("keepIt")+'</button><button class="btn-del" data-confirm-del-id="'+entry.id+'">'+t("deleteBtn")+'</button></div></div>';
        }
      });
      html+='<div class="ledger-total"><span class="lbl">'+t("monthTotal")+'</span><span class="val">'+fmtNum(totalQty)+'L &middot; '+fmtMoney(totalAmount,currency)+'</span></div>';
      html+='</div>';
      html+='<button class="receipt-btn" id="btn-download-receipt">'+iconDownload(16)+' '+t("downloadReceipt")+'</button>';
    }
    html+='</div>';

    if(!state.storageOk){ html+='<div class="storage-warn">'+t("storageWarn")+'</div>'; }
    html+='<div class="footer-note">'+t("footerNote")+' \ud83e\udd5b</div>';

    /* Settings sheet */
    html+='<div class="overlay'+(state.settingsOpen?" open":"")+'" id="overlay">';
    html+='<div class="sheet" onclick="event.stopPropagation()">';
    html+='<div class="sheet-handle"></div><div class="sheet-title">'+t("settingsTitle")+'</div>';

    html+='<div class="field-block"><label class="field-label">'+t("yourName")+'</label>';
    html+='<input type="text" id="input-username" value="'+escapeHtml(state.settingsDraft.userName||"")+'" placeholder="'+escapeHtml(t("namePlaceholder"))+'" /></div>';

    html+='<div class="field-block"><label class="field-label">'+t("dairyName")+'</label>';
    html+='<input type="text" id="input-dairy-name" value="'+escapeHtml(state.settingsDraft.dairyName||"")+'" placeholder="Daily Dairy" /></div>';

    html+='<div class="field-block"><label class="field-label">'+t("defaultRate")+'</label><input type="number" min="0" step="0.5" id="input-default-rate" value="'+(state.settingsDraft.rate!==undefined?state.settingsDraft.rate:"")+'" style="font-family:\'JetBrains Mono\', monospace;" /></div>';
    html+='<div class="field-hint" style="margin-bottom:16px;">'+t("rateHint")+'</div>';

    html+='<div class="field-block"><label class="field-label">'+t("language")+'</label>';
    html+='<div class="lang-row"><button class="'+(state.settingsDraft.lang==="en"?"active":"")+'" id="set-lang-en">English</button><button class="'+(state.settingsDraft.lang==="hi"?"active":"")+'" id="set-lang-hi">\u0939\u093f\u0902\u0926\u0940</button></div></div>';

    html+='<div class="sheet-actions"><button class="btn-cancel" id="btn-settings-cancel">'+t("cancel")+'</button><button class="btn-save" id="btn-settings-save">'+t("saveSettings")+'</button></div>';
    html+='</div></div>';

    html+='<div class="toast" id="toast"></div>';

    app.innerHTML=html;
    bindEvents();
  }

  function bindEvents(){
    var byId=function(id){ return document.getElementById(id); };

    if(byId("btn-settings")) byId("btn-settings").addEventListener("click",openSettings);
    if(byId("btn-lang-en")) byId("btn-lang-en").addEventListener("click",function(){ setLang("en"); });
    if(byId("btn-lang-hi")) byId("btn-lang-hi").addEventListener("click",function(){ setLang("hi"); });
    if(byId("btn-prev-month")) byId("btn-prev-month").addEventListener("click",function(){ changeMonth(-1); });
    if(byId("btn-next-month")) byId("btn-next-month").addEventListener("click",function(){ changeMonth(1); });
    if(byId("btn-toggle-paid")) byId("btn-toggle-paid").addEventListener("click",togglePaid);
    if(byId("btn-cancel-edit")) byId("btn-cancel-edit").addEventListener("click",cancelEdit);
    if(byId("btn-toggle-na")) byId("btn-toggle-na").addEventListener("click",toggleNA);
    if(byId("btn-toggle-rate")) byId("btn-toggle-rate").addEventListener("click",function(){ state.rateEditOpen=!state.rateEditOpen; render(); });
    if(byId("btn-qty-minus")) byId("btn-qty-minus").addEventListener("click",function(){ adjustQty(-0.5); });
    if(byId("btn-qty-plus")) byId("btn-qty-plus").addEventListener("click",function(){ adjustQty(0.5); });
    if(byId("btn-submit")) byId("btn-submit").addEventListener("click",submitForm);
    if(byId("btn-download-receipt")) byId("btn-download-receipt").addEventListener("click",downloadReceipt);

    if(byId("btn-settings-cancel")) byId("btn-settings-cancel").addEventListener("click",function(){ state.settingsOpen=false; render(); });
    if(byId("btn-settings-save")) byId("btn-settings-save").addEventListener("click",function(){
      state.settingsDraft.userName=byId("input-username").value;
      state.settingsDraft.dairyName=byId("input-dairy-name").value;
      state.settingsDraft.rate=byId("input-default-rate").value;
      saveSettings();
    });
    if(byId("set-lang-en")) byId("set-lang-en").addEventListener("click",function(){ state.settingsDraft.lang="en"; render(); });
    if(byId("set-lang-hi")) byId("set-lang-hi").addEventListener("click",function(){ state.settingsDraft.lang="hi"; render(); });

    var overlay=byId("overlay"); if(overlay) overlay.addEventListener("click",function(){ state.settingsOpen=false; render(); });

    var inputDate=byId("input-date"); if(inputDate) inputDate.addEventListener("change",function(e){ handleDateChange(e.target.value); });
    var inputQty=byId("input-qty");
    if(inputQty){ inputQty.addEventListener("input",function(e){ state.formQty=parseFloat(e.target.value)||0; }); inputQty.addEventListener("change",function(){ render(); }); }
    var inputRate=byId("input-rate");
    if(inputRate){ inputRate.addEventListener("input",function(e){ state.formRate=parseFloat(e.target.value)||0; }); inputRate.addEventListener("change",function(){ render(); }); }

    document.querySelectorAll("[data-qty]").forEach(function(btn){ btn.addEventListener("click",function(){ state.formQty=parseFloat(btn.getAttribute("data-qty")); render(); }); });
    document.querySelectorAll("[data-edit-id]").forEach(function(btn){ btn.addEventListener("click",function(){ startEdit(btn.getAttribute("data-edit-id")); }); });
    document.querySelectorAll("[data-del-id]").forEach(function(btn){ btn.addEventListener("click",function(){ var id=btn.getAttribute("data-del-id"); state.deleteConfirmId=(state.deleteConfirmId===id)?null:id; render(); }); });
    document.querySelectorAll("[data-keep-id]").forEach(function(btn){ btn.addEventListener("click",function(){ state.deleteConfirmId=null; render(); }); });
    document.querySelectorAll("[data-confirm-del-id]").forEach(function(btn){ btn.addEventListener("click",function(){ deleteEntry(btn.getAttribute("data-confirm-del-id")); }); });
  }

  loadData();
})();
</script>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js")
                .then(() => {
                    console.log("Service Worker registered successfully");
                })
                .catch(error => {
                    console.error("Service Worker registration failed:", error);
                });
        });
    }
</script>
</body>
</html>
