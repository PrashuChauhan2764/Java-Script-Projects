<svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of children running a race on sports day">
  <rect width="600" height="460" fill="#FCE7C4"/>
  <ellipse cx="300" cy="440" rx="300" ry="30" fill="#4C9153"/>
  <rect x="0" y="260" width="600" height="200" fill="#5DA463"/>
  <!-- running track lanes -->
  <g stroke="#FBF7EE" stroke-width="4" stroke-dasharray="14 12" opacity=".8">
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="340" x2="600" y2="340"/>
    <line x1="0" y1="380" x2="600" y2="380"/>
  </g>
  <!-- finish flag -->
  <rect x="520" y="180" width="6" height="180" fill="#14335B"/>
  <polygon points="526,182 566,196 526,210" fill="#C0392B"/>

  <!-- runners -->
  <g>
    <circle cx="140" cy="330" r="15" fill="#E8B98A"/>
    <path d="M124 344 Q140 356 156 344 L152 372 L136 366 L128 372 Z" fill="#C0392B"/>
    <line x1="132" y1="368" x2="118" y2="392" stroke="#14335B" stroke-width="6" stroke-linecap="round"/>
    <line x1="146" y1="368" x2="158" y2="390" stroke="#14335B" stroke-width="6" stroke-linecap="round"/>
    <line x1="126" y1="350" x2="108" y2="336" stroke="#E8B98A" stroke-width="6" stroke-linecap="round"/>
    <line x1="152" y1="350" x2="168" y2="362" stroke="#E8B98A" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="240" cy="356" r="15" fill="#C88A5A"/>
    <path d="M224 370 Q240 382 256 370 L252 398 L236 392 L228 398 Z" fill="#1F4C85"/>
    <line x1="232" y1="394" x2="216" y2="416" stroke="#14335B" stroke-width="6" stroke-linecap="round"/>
    <line x1="246" y1="394" x2="260" y2="418" stroke="#14335B" stroke-width="6" stroke-linecap="round"/>
    <line x1="226" y1="376" x2="206" y2="364" stroke="#C88A5A" stroke-width="6" stroke-linecap="round"/>
    <line x1="252" y1="376" x2="270" y2="388" stroke="#C88A5A" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="360" cy="320" r="15" fill="#E8B98A"/>
    <path d="M344 334 Q360 346 376 334 L372 362 L356 356 L348 362 Z" fill="#3F7D46"/>
    <line x1="352" y1="358" x2="336" y2="380" stroke="#14335B" stroke-width="6" stroke-linecap="round"/>
    <line x1="366" y1="358" x2="380" y2="382" stroke="#14335B" stroke-width="6" stroke-linecap="round"/>
    <line x1="346" y1="340" x2="328" y2="328" stroke="#E8B98A" stroke-width="6" stroke-linecap="round"/>
    <line x1="372" y1="340" x2="390" y2="352" stroke="#E8B98A" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- sun and confetti -->
  <circle cx="80" cy="80" r="30" fill="#F0A63A"/>
  <g fill="#C0392B"><circle cx="450" cy="90" r="5"/><circle cx="480" cy="130" r="4"/></g>
  <g fill="#1F4C85"><circle cx="500" cy="70" r="4"/><circle cx="430" cy="60" r="5"/></g>
  <g fill="#3F7D46"><circle cx="470" cy="50" r="4"/></g>
</svg>
