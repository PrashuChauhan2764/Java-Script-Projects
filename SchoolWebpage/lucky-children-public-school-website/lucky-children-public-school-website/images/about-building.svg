<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wide illustration of the Lucky Children Public School building and front yard">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE7C4"/>
      <stop offset="100%" stop-color="#FBF7EE"/>
    </linearGradient>
  </defs>
  <rect width="700" height="520" fill="url(#sky3)"/>
  <circle cx="600" cy="90" r="46" fill="#F0A63A" opacity=".9"/>
  <path d="M0 360 Q120 320 250 350 T 500 340 T 700 360 L700 520 L0 520 Z" fill="#DCEEDC"/>
  <ellipse cx="350" cy="500" rx="330" ry="20" fill="#B7DDB4"/>

  <!-- main building, two storeys -->
  <rect x="110" y="200" width="480" height="230" fill="#F6EFE0" stroke="#14335B" stroke-width="3"/>
  <rect x="90" y="180" width="520" height="26" fill="#14335B"/>
  <rect x="330" y="150" width="40" height="34" fill="#F0A63A"/>
  <polygon points="70,182 350,110 630,182" fill="#1F4C85"/>

  <!-- signage -->
  <rect x="250" y="212" width="200" height="30" rx="6" fill="#14335B"/>
  <text x="350" y="233" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#F0A63A" font-weight="bold">LUCKY CHILDREN PUBLIC SCHOOL</text>

  <!-- ground floor windows + door -->
  <g fill="#1F4C85">
    <rect x="140" y="330" width="46" height="50" rx="4"/>
    <rect x="210" y="330" width="46" height="50" rx="4"/>
    <rect x="444" y="330" width="46" height="50" rx="4"/>
    <rect x="514" y="330" width="46" height="50" rx="4"/>
  </g>
  <g stroke="#FBF7EE" stroke-width="3">
    <line x1="163" y1="330" x2="163" y2="380"/><line x1="140" y1="355" x2="186" y2="355"/>
    <line x1="233" y1="330" x2="233" y2="380"/><line x1="210" y1="355" x2="256" y2="355"/>
    <line x1="467" y1="330" x2="467" y2="380"/><line x1="444" y1="355" x2="490" y2="355"/>
    <line x1="537" y1="330" x2="537" y2="380"/><line x1="514" y1="355" x2="560" y2="355"/>
  </g>
  <rect x="320" y="340" width="60" height="90" rx="4" fill="#3F7D46"/>
  <rect x="348" y="340" width="6" height="90" fill="#FBF7EE"/>
  <circle cx="366" cy="384" r="3" fill="#F0A63A"/>

  <!-- upper floor windows -->
  <g fill="#1F4C85">
    <rect x="140" y="256" width="46" height="50" rx="4"/>
    <rect x="210" y="256" width="46" height="50" rx="4"/>
    <rect x="280" y="256" width="46" height="50" rx="4"/>
    <rect x="374" y="256" width="46" height="50" rx="4"/>
    <rect x="444" y="256" width="46" height="50" rx="4"/>
    <rect x="514" y="256" width="46" height="50" rx="4"/>
  </g>
  <g stroke="#FBF7EE" stroke-width="3">
    <line x1="163" y1="256" x2="163" y2="306"/><line x1="140" y1="281" x2="186" y2="281"/>
    <line x1="233" y1="256" x2="233" y2="306"/><line x1="210" y1="281" x2="256" y2="281"/>
    <line x1="303" y1="256" x2="303" y2="306"/><line x1="280" y1="281" x2="326" y2="281"/>
    <line x1="397" y1="256" x2="397" y2="306"/><line x1="374" y1="281" x2="420" y2="281"/>
    <line x1="467" y1="256" x2="467" y2="306"/><line x1="444" y1="281" x2="490" y2="281"/>
    <line x1="537" y1="256" x2="537" y2="306"/><line x1="514" y1="281" x2="560" y2="281"/>
  </g>

  <!-- flag pole -->
  <line x1="605" y1="200" x2="605" y2="120" stroke="#8A5A34" stroke-width="4"/>
  <polygon points="605,120 645,132 605,144" fill="#3F7D46"/>

  <!-- trees -->
  <g>
    <rect x="52" y="380" width="12" height="50" fill="#8A5A34"/>
    <circle cx="58" cy="362" r="34" fill="#3F7D46"/>
    <circle cx="34" cy="380" r="24" fill="#4C9153"/>
    <circle cx="82" cy="380" r="24" fill="#4C9153"/>
  </g>
  <g>
    <rect x="630" y="384" width="12" height="46" fill="#8A5A34"/>
    <circle cx="636" cy="366" r="30" fill="#4C9153"/>
    <circle cx="616" cy="384" r="20" fill="#3F7D46"/>
    <circle cx="656" cy="384" r="20" fill="#3F7D46"/>
  </g>

  <!-- children near gate -->
  <circle cx="230" cy="440" r="14" fill="#E8B98A"/>
  <path d="M212 456 Q230 468 248 456 L248 480 Q230 488 212 480 Z" fill="#D98A1F"/>
  <circle cx="270" cy="446" r="13" fill="#C88A5A"/>
  <path d="M255 460 Q270 470 285 460 L285 482 Q270 488 255 482 Z" fill="#1F4C85"/>
</svg>
