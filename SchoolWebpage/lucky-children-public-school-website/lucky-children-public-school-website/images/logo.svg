<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lucky Children Public School emblem">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0A63A"/>
      <stop offset="100%" stop-color="#D98A1F"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="#14335B" stroke="url(#ringGrad)" stroke-width="3"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#F0A63A" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- sun rays -->
  <g stroke="#F0A63A" stroke-width="2.4" stroke-linecap="round" opacity="0.95">
    <line x1="60" y1="14" x2="60" y2="22"/>
    <line x1="60" y1="98" x2="60" y2="106"/>
    <line x1="14" y1="60" x2="22" y2="60"/>
    <line x1="98" y1="60" x2="106" y2="60"/>
    <line x1="27" y1="27" x2="33" y2="33"/>
    <line x1="87" y1="87" x2="93" y2="93"/>
    <line x1="93" y1="27" x2="87" y2="33"/>
    <line x1="33" y1="87" x2="27" y2="93"/>
  </g>

  <!-- open book -->
  <g transform="translate(60,66)">
    <path d="M -30 -6 C -20 -12, -8 -12, 0 -6 C 8 -12, 20 -12, 30 -6 L 30 14 C 20 8, 8 8, 0 14 C -8 8, -20 8, -30 14 Z"
          fill="#FBF7EE" stroke="#F0A63A" stroke-width="1.5"/>
    <line x1="0" y1="-6" x2="0" y2="14" stroke="#F0A63A" stroke-width="1.5"/>
    <path d="M -24 -2 L -6 -2 M -24 3 L -6 3 M -24 8 L -6 8" stroke="#14335B" stroke-width="1.1" opacity="0.5"/>
    <path d="M 6 -2 L 24 -2 M 6 3 L 24 3 M 6 8 L 24 8" stroke="#14335B" stroke-width="1.1" opacity="0.5"/>
  </g>

  <!-- torch / rising star above book, symbol of knowledge -->
  <path d="M 60 24 L 63.5 33 L 73 33.5 L 65.5 39.5 L 68 49 L 60 43.5 L 52 49 L 54.5 39.5 L 47 33.5 L 56.5 33 Z"
        fill="#F0A63A"/>

  <text x="60" y="100" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9.5" fill="#FBF7EE" letter-spacing="1.5">LCPS</text>
</svg>
