<svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of the school building with children and the sun">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0A63A"/>
      <stop offset="55%" stop-color="#FCE7C4"/>
      <stop offset="100%" stop-color="#FBF7EE"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6EFE0"/>
      <stop offset="100%" stop-color="#EFE4CC"/>
    </linearGradient>
  </defs>
  <rect width="600" height="460" fill="url(#sky)"/>
  <circle cx="500" cy="90" r="52" fill="#F0A63A" opacity="0.9"/>
  <g stroke="#F0A63A" stroke-width="4" stroke-linecap="round" opacity="0.65">
    <line x1="500" y1="6" x2="500" y2="24"/>
    <line x1="500" y1="156" x2="500" y2="174"/>
    <line x1="416" y1="90" x2="434" y2="90"/>
    <line x1="566" y1="90" x2="584" y2="90"/>
    <line x1="440" y1="30" x2="452" y2="42"/>
    <line x1="548" y1="138" x2="560" y2="150"/>
    <line x1="560" y1="30" x2="548" y2="42"/>
    <line x1="452" y1="138" x2="440" y2="150"/>
  </g>
  <ellipse cx="300" cy="424" rx="280" ry="26" fill="#E4F0E3"/>

  <!-- distant hills -->
  <path d="M0 330 Q 90 290 190 320 T 380 310 T 600 330 L 600 460 L 0 460 Z" fill="#DCEEDC"/>

  <!-- school building -->
  <g>
    <rect x="120" y="210" width="360" height="180" rx="6" fill="url(#wall)" stroke="#14335B" stroke-width="3"/>
    <polygon points="100,214 300,140 500,214" fill="#14335B"/>
    <rect x="288" y="150" width="24" height="34" fill="#F0A63A"/>
    <!-- windows row 1 -->
    <g fill="#1F4C85">
      <rect x="148" y="236" width="42" height="42" rx="4"/>
      <rect x="210" y="236" width="42" height="42" rx="4"/>
      <rect x="348" y="236" width="42" height="42" rx="4"/>
      <rect x="410" y="236" width="42" height="42" rx="4"/>
    </g>
    <g stroke="#FBF7EE" stroke-width="3">
      <line x1="169" y1="236" x2="169" y2="278"/><line x1="148" y1="257" x2="190" y2="257"/>
      <line x1="231" y1="236" x2="231" y2="278"/><line x1="210" y1="257" x2="252" y2="257"/>
      <line x1="369" y1="236" x2="369" y2="278"/><line x1="348" y1="257" x2="390" y2="257"/>
      <line x1="431" y1="236" x2="431" y2="278"/><line x1="410" y1="257" x2="452" y2="257"/>
    </g>
    <!-- door -->
    <rect x="272" y="308" width="56" height="82" rx="4" fill="#3F7D46"/>
    <rect x="296" y="308" width="8" height="82" fill="#FBF7EE"/>
    <!-- row 2 windows -->
    <g fill="#1F4C85">
      <rect x="148" y="318" width="42" height="42" rx="4"/>
      <rect x="410" y="318" width="42" height="42" rx="4"/>
    </g>
    <g stroke="#FBF7EE" stroke-width="3">
      <line x1="169" y1="318" x2="169" y2="360"/><line x1="148" y1="339" x2="190" y2="339"/>
      <line x1="431" y1="318" x2="431" y2="360"/><line x1="410" y1="339" x2="452" y2="339"/>
    </g>
  </g>

  <!-- tree -->
  <g>
    <rect x="66" y="330" width="14" height="60" fill="#8A5A34"/>
    <circle cx="73" cy="310" r="40" fill="#3F7D46"/>
    <circle cx="46" cy="330" r="28" fill="#4C9153"/>
    <circle cx="100" cy="330" r="28" fill="#4C9153"/>
  </g>

  <!-- children figures -->
  <g>
    <!-- child 1 -->
    <circle cx="200" cy="372" r="16" fill="#E8B98A"/>
    <path d="M180 388 Q200 402 220 388 L220 420 Q200 430 180 420 Z" fill="#F0A63A"/>
    <rect x="188" y="418" width="10" height="26" fill="#14335B"/>
    <rect x="204" y="418" width="10" height="26" fill="#14335B"/>
    <!-- child 2 -->
    <circle cx="252" cy="378" r="15" fill="#C88A5A"/>
    <path d="M234 392 Q252 405 270 392 L270 422 Q252 431 234 422 Z" fill="#3F7D46"/>
    <rect x="240" y="420" width="9" height="24" fill="#14335B"/>
    <rect x="255" y="420" width="9" height="24" fill="#14335B"/>
    <!-- child 3 with backpack -->
    <circle cx="356" cy="374" r="16" fill="#E8B98A"/>
    <path d="M336 390 Q356 404 376 390 L376 422 Q356 432 336 422 Z" fill="#1F4C85"/>
    <rect x="344" y="420" width="10" height="26" fill="#14335B"/>
    <rect x="360" y="420" width="10" height="26" fill="#14335B"/>
    <rect x="368" y="392" width="16" height="24" rx="4" fill="#D98A1F"/>
  </g>
</svg>
