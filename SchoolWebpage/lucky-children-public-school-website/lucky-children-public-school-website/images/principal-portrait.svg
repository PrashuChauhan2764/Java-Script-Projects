<svg viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Portrait illustration of Principal Mr. Pradeep Chauhan">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F4C85"/>
      <stop offset="100%" stop-color="#0D2444"/>
    </linearGradient>
  </defs>
  <rect width="400" height="460" fill="url(#pbg)"/>
  <circle cx="330" cy="60" r="70" fill="#F0A63A" opacity=".12"/>
  <circle cx="60" cy="420" r="90" fill="#F0A63A" opacity=".08"/>

  <!-- shoulders / blazer -->
  <path d="M90 460 Q90 360 200 350 Q310 360 310 460 Z" fill="#14335B"/>
  <path d="M150 380 L200 420 L250 380 L250 460 L150 460 Z" fill="#FBF7EE"/>
  <polygon points="196,382 200,420 178,392" fill="#C0392B"/>
  <polygon points="204,382 200,420 222,392" fill="#8E2A20"/>

  <!-- neck -->
