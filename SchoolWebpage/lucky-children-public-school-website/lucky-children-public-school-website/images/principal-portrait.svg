    <rect x="206" y="236" width="34" height="24" rx="6"/>
    <line x1="194" y1="246" x2="206" y2="246"/>
  </g>
  <circle cx="177" cy="248" r="2" fill="#14335B"/>
  <circle cx="223" cy="248" r="2" fill="#14335B"/>

  <!-- eyebrows -->
  <path d="M164 230 Q177 224 190 230" stroke="#2A2A2A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M210 230 Q223 224 236 230" stroke="#2A2A2A" stroke-width="3" fill="none" stroke-linecap="round"/>
